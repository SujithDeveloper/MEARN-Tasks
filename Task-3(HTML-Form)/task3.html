<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3</title>
</head>
<body>
    <h1>Workshop Registration</h1>

    <form action="">
        <select name="" id="">
            <option value="">More Options</option>
        </select>

        <hr>

        <p><u>Register Now When seats are available!</u></p>
        
        <label for="fName">First Name:</label>
        <input type="text" name="" id="fName">
        <br><br>

         <label for="lName">Last Name:</label>
        <input type="text" name="" id="lName">
        <br><br>
        
        <label for="com">Company Institute:</label>
        <input type="text" name="" id="com">
        <br><br>

        <label for="add">Address:</label>
        <textarea cols="32" rows="5" name="" id="add"></textarea>
        <br><br>

        <label for="city">City:</label>
        <input type="text" name="" id="city">
        <br><br>

        <label for="state">State/Province/Region:</label>
        <select name="" id="state">
            <option selected disabled hidden value="">select one</option>
            <option value="">Kerala</option>
            <option value="">Tamilnadu</option>
            <option value="">Karnataka</option>
        </select>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" name="" id="email">
        <br><br>

        <label for="ph">Phone Number:</label>
        <input type="number" name="" id="ph">
        <br><br>

        <u>Lunch</u>
        <br><br>

        <label for="meal">Meal Preference:</label>
        <select name="" id="meal">
            <option selected value="">Vegetarian</option>
            <option value="">Non Vegetarian</option>
        </select>
        <br><br>

        <u>Payment Details</u>
        <br><br>

        <label for="">Payment Mode:</label>
        <input type="radio" name="payment" id="cash">
        <label for="cash">Cash</label>
        <input type="radio" name="payment" id="cheque">
        <label for="cheque">Cheque</label>
        <input type="radio" name="payment" id="draft">
        <label for="draft">Demand Draft</label>
        <br><br>

        <label for="dd">DD/Cheque no:</label>
        <input type="number" name="" id="dd">
        <br><br>

        <label for="bank">Drawn On(Bank Name):</label>
        <input type="text" name="" id="bank">
        <br><br>

        <label for="payAt">Payable At:</label>
        <input type="text" name="" id="payAt">
        <br><br>

        <hr>

        <button>Submit</button>
        <input type="button" value="Reset">
    </form>
    
</body>
</html>
